---

version: "3"

services:
  
  gempdb:
    container_name: gemp_swccg_db
    ports:
      - target: 3306
        published: 35010
      
  gemp:
    container_name: gemp_swccg_app
    ports:
      # Gemp ports
      - target: 8080
        published: 17010
      # Debugger ports
      - target: 8000
        published: 8060
    volumes:
      - type: bind
        source: ./gemp-swccg-async/src/main/web/
        target: /opt/gemp-swccg/web
      - type: bind
        source: ./gemp-swccg-async/target/web.jar
        target: /opt/gemp-swccg/web.jar
      - type: bind
        source: ./logs
        target: /logs
      - type: bind
        source: ./replay
        target: /replay
    environment:
      - "environment=test"
    command: ["/usr/bin/wait-for-it.sh", "gempdb:3306", "--",
              "/usr/bin/java",
              "-Xmx4g",
              "-Dlog4j.debug",
              "-Dlog4j.configuration=test-log4j.xml",
              "-cp", "web.jar",
              "com.gempukku.swccgo.async.SwccgoAsyncServer"]