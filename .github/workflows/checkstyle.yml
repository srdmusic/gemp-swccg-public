---
name: Checkstyle

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - ".github/workflows/checkstyle.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - ".github/workflows/checkstyle.yml"

permissions:
  contents: read

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Checkstyle
        working-directory: src
        run: mvn --batch-mode --no-transfer-progress checkstyle:check
