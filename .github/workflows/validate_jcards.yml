name: Validate CardImages.js

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate-jcards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Check out repo
        uses: actions/checkout@master
      - name: Validate CardImages.js
        run: ./bin/gemp validate-cardimages