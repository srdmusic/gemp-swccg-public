<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GEMPEpicDuel</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body class="dark">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
      <div id="unity-loading-bar">
        <div id="unity-logo"><img src="logo.png"></div>
        <div id="unity-progress-bar-empty" style="display: none;">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
    <div id="unity-fullscreen-button" style="display: none;"></div>
    <script src="../js/gemp-016/cards/CardImages.js"></script>
    <script>
      // =====================================================================
      // CARD IMAGE INTERCEPTOR
      // Keep every Unity card-image request on localhost so Epic Duel works
      // without internet access. The standard image map supplies newer cards
      // that have not reached Epic Duel's bundled map yet.
      // =====================================================================
      (function installCardImageInterceptor() {
        var _cardImageMap = (typeof fixedImages === 'undefined') ? {} : fixedImages;
        fetch('StreamingAssets/cardImages.json')
          .then(function(r) { return r.json(); })
          .then(function(map) {
            _cardImageMap = Object.assign({}, _cardImageMap, map);
            console.log('[GEMP] Card image map loaded: ' + Object.keys(_cardImageMap).length + ' entries');
          })
          .catch(function(e) { console.error('[GEMP] Failed to load card image map:', e); });
        function localImageUrl(url) {
          var marker = 'res.starwarsccg.org/';
          var markerIndex = url.indexOf(marker);
          if (markerIndex < 0) return null;
          return '/gemp-swccg/localimage/' + url.substring(markerIndex + marker.length);
        }
        function remap(url) {
          if (typeof url !== 'string') return null;
          if (url.indexOf('res.starwarsccg.org/') >= 0) {
            return localImageUrl(url);
          }
          if (_cardImageMap) {
            var m = url.match(/\/gemp-swccg\/i_(.+?)(?:\?.*)?$/);
            if (m) {
              var cdnUrl = _cardImageMap[m[1]];
              if (cdnUrl) {
                return localImageUrl(cdnUrl);
              }
            }
          }
          return null;
        }
        var _origFetch = window.fetch;
        window.fetch = function(input, init) {
          var url = (typeof input === 'string') ? input
                  : (input && input.url) ? input.url : '';
          var cdnUrl = remap(url);
          if (cdnUrl) {
            return _origFetch.call(this, cdnUrl, init);
          }
          return _origFetch.apply(this, arguments);
        };
        // --- Image element interception (2026-08-30) ---------------------
        // Unity WebGL loads card textures by assigning HTMLImageElement.src,
        // which bypasses both the fetch and XHR hooks above. Without this the
        // Epic Duel client requests res.starwarsccg.org directly and shows card
        // BACKS when offline, even though fetch/XHR rewriting works correctly.
        // Patch the src setter so those loads go to the local image endpoint too.
        try {
          var _imgProto = HTMLImageElement.prototype;
          var _srcDesc = Object.getOwnPropertyDescriptor(_imgProto, 'src')
                      || Object.getOwnPropertyDescriptor(Element.prototype, 'src');
          if (_srcDesc && _srcDesc.set) {
            Object.defineProperty(_imgProto, 'src', {
              configurable: true,
              enumerable: _srcDesc.enumerable,
              get: function() { return _srcDesc.get.call(this); },
              set: function(value) {
                var mapped = remap(value);
                return _srcDesc.set.call(this, mapped ? mapped : value);
              }
            });
          }
          // setAttribute('src', ...) is a second route to the same load.
          var _origSetAttr = Element.prototype.setAttribute;
          Element.prototype.setAttribute = function(name, value) {
            if (this instanceof HTMLImageElement
                && typeof name === 'string' && name.toLowerCase() === 'src') {
              var mapped = remap(value);
              if (mapped) return _origSetAttr.call(this, name, mapped);
            }
            return _origSetAttr.apply(this, arguments);
          };
        } catch (e) {
          console.error('[GEMP] Image src interception failed:', e);
        }

        var _origOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
          var cdnUrl = remap(url);
          if (cdnUrl) {
            return _origOpen.apply(this,
              [method, cdnUrl].concat(Array.prototype.slice.call(arguments, 2)));
          }
          return _origOpen.apply(this, arguments);
        };
      })();
      // =====================================================================

      const hideFullScreenButton = "1";
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/9e2cd8213a14debe431d5b6d5ab73726.loader.js";
      const config = {
        dataUrl: buildUrl + "/2bf3972bf544adc214f6cebdefae8938.data.unityweb",
        frameworkUrl: buildUrl + "/1243cc057316c97603f72811300d66b0.framework.js.unityweb",
        codeUrl: buildUrl + "/d169da0ea65743c48e533321903117c6.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "200 Monkeys",
        productName: "GEMPEpicDuel",
        productVersion: "2.6",
      };
      
      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const spinner = document.querySelector('.spinner');

      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      }
      loadingCover.style.display = "";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
			loadingCover.style.display = "none";
			if (canFullscreen) {
				if (!hideFullScreenButton) {
			  	fullscreenButton.style.display = "";
				}
				fullscreenButton.onclick = () => {
			  	unityInstance.SetFullscreen(1);
				};
			}
          	var canvas = unityInstance.Module.canvas;
			var container = canvas.parentElement;
			function onResize() {
				var w;
				var h;

				if (scaleToFit) {
					w = window.innerWidth;
					h = window.innerHeight;

					var r = 1080 / 1920;

					if (w * r > window.innerHeight) {
						w = Math.min(w, Math.ceil(h / r));
					}
					h = Math.floor(w * r);
				} else {
					w = 1920;
					h = 1080;
				}

				container.style.width = canvas.style.width = w + "px";
				container.style.height = canvas.style.height = h + "px";
				container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
				container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
			}

			var scaleToFit;
			try {
				scaleToFit = !!JSON.parse("1");
			} catch (e) {
				scaleToFit = true;
			}
			window.addEventListener('resize', onResize);
			onResize();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
